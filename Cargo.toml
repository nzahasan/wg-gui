[package]
name = "wg-client"
version = "0.1.0"
edition = "2024"

# Shared WireGuard core used by both front-ends.
[lib]
name = "wg_common"
path = "src/common/lib.rs"

# Build with: cargo cli  (cargo build --release --bin wg-cli)
[[bin]]
name = "wg-cli"
path = "src/cli/main.rs"

# Build with: cargo gui  (cargo build --release --bin wg-gui --features gui)
[[bin]]
name = "wg-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
gui = ["dep:iced", "dep:rfd", "dep:tray-icon", "dep:resvg", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
blake2 = "0.11"
iced = { version = "0.14", optional = true, features = ["canvas", "svg", "tokio"] }
rfd = { version = "0.17", optional = true }
# Menu-bar (tray) icon and its menu.
tray-icon = { version = "0.26", optional = true }
# Rasterises the menu-bar icon SVG (the same resvg iced uses).
resvg = { version = "0.45", optional = true, default-features = false }
# Sets the Dock icon; same versions winit already uses.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSRunningApplication", "NSImage", "NSResponder", "NSWindow", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSData", "NSArray", "NSString"] }

# block 0.1.6 (via iced -> wgpu -> metal) declares an extern static of an
# uninhabited type, which future Rust will reject. Use a copy with that fixed.
[patch.crates-io]
block = { path = "vendor/block" }
